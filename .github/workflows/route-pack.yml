name: Route pack

# Weekly NOAA ENC -> area route packs for the NOAA Route app. NOAA publishes
# ENC updates Friday afternoon (US Eastern), so build Saturday morning.
# Areas and their reference routes are defined in tools/areas.json; nothing is
# published unless every reference route still passes.
# Each area builds in its own job (in parallel; one run with every region in
# sequence would pass the job time limit), then one job tests them together and
# publishes.
on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  areas:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        run: echo "ids=$(python3 -c 'import json; print(json.dumps([a["id"] for a in json.load(open("tools/areas.json"))["areas"]]))')" >> "$GITHUB_OUTPUT"

  build:
    needs: areas
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        id: ${{ fromJSON(needs.areas.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy

      - name: Build ${{ matrix.id }}
        run: |
          python3 tools/build_route_pack.py -a ${{ matrix.id }} -o packs
          mv packs/catalog.json packs/catalog-${{ matrix.id }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.id }}
          path: packs/
          retention-days: 3

  test-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: packs
          merge-multiple: true

      - name: Merge catalog
        run: |
          python3 - <<'EOF'
          import glob, json, os
          ids = [a["id"] for a in json.load(open("tools/areas.json"))["areas"]]
          entries = {}
          for f in glob.glob("packs/catalog-*.json"):
              for e in json.load(open(f))["areas"]:
                  entries[e["id"]] = e
              os.remove(f)
          missing = [i for i in ids if i not in entries]
          if missing:
              raise SystemExit(f"No pack built for {missing}")
          json.dump({"version": 2, "areas": [entries[i] for i in ids]}, open("packs/catalog.json", "w"), indent=1)
          print(f"Catalog with {len(ids)} areas")
          EOF
          ls -l packs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Reference routes
        working-directory: android
        env:
          PACK_DIR: ${{ github.workspace }}/packs
          AREAS_JSON: ${{ github.workspace }}/tools/areas.json
        run: |
          rc=0
          gradle --no-daemon testReleaseUnitTest --tests '*AreaRoutesTest' -i > routes.log 2>&1 || rc=$?
          grep -E 'PASS\?|REFUSED|POINTS|PROGRESS|Reference route failures|^ +[a-z]+: ' routes.log || tail -50 routes.log
          # Full planner explanations (multi-line) for any failed route
          if [ $rc -ne 0 ]; then sed -n '/Reference route failures:/,/at org\.junit\./p' routes.log; fi
          # Died without a failure report (a crash or out of memory): show the end of the log
          if [ $rc -ne 0 ] && ! grep -q 'Reference route failures:' routes.log; then grep -v 'PROGRESS\|POINTS' routes.log | tail -60; fi
          exit $rc

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main publishes to the route-pack release the app uses; a branch run publishes to
          # the route-pack-beta pre-release, which only APKs built from a branch read
          version="build ${GITHUB_RUN_NUMBER}"
          day="$(date -u +%Y-%m-%d)"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tag=route-pack; flags=""; title="Route packs $version ($day)"
          else
            tag=route-pack-beta; flags="--prerelease"; title="Route packs, test $version from ${GITHUB_REF_NAME} ($day)"
          fi
          notes="NOAA ENC area route packs for the NOAA Route app, $version, built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}. Not for navigation."
          gh release view $tag >/dev/null 2>&1 || gh release create $tag $flags --title "$title" --notes "$notes"
          gh release upload $tag packs/*.bin packs/catalog.json --clobber
          # Renamed rather than recreated like the app release: the app downloads packs from
          # here at any time, and a delete/create would leave a moment with no files
          gh release edit $tag --title "$title" --notes "$notes"
