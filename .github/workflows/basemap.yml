name: Base map

# OpenStreetMap base map for the chart screen (tools/build_basemap.sh), one file per
# NCDS region, max zoom 14 (MapLibre draws it larger past that). Test stage: region 04
# only. Published beside the in-app chart tiles: Ncds_<region>_basemap.pmtiles and a
# "basemap" object on that region's entry in catalog.json of vector-maps (main) or
# vector-maps-beta (a branch). vector-maps.yml keeps the object when it rebuilds a region.
on:
  push:
    paths:
      - "tools/build_basemap.sh"
      - ".github/workflows/basemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-${{ github.ref == 'refs/heads/main' && 'main' || 'beta' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Tools (go-pmtiles 1.31.2, tippecanoe 2.79.0)
        run: |
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin pmtiles
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev >/dev/null
          git clone -q --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -s -C /tmp/tippecanoe -j"$(nproc)" tile-join
          sudo cp /tmp/tippecanoe/tile-join /usr/local/bin/
      - name: Region 04
        run: tools/build_basemap.sh Ncds_04 -77.8,38.23,-73.4,39.73 14 out
      - name: Size
        run: |
          echo "Ncds_04 base map: all layers $(du -h out/Ncds_04_basemap_full.pmtiles | cut -f1), trimmed $(du -h out/Ncds_04_basemap.pmtiles | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag=vector-maps; else tag=vector-maps-beta; fi
          gh release upload $tag out/Ncds_04_basemap.pmtiles --clobber
          gh release download $tag -p catalog.json -O catalog.json --clobber
          python3 - <<'PY'
          import hashlib, json, os, datetime
          f = "out/Ncds_04_basemap.pmtiles"
          h = hashlib.sha256()
          with open(f, "rb") as fh:
              for b in iter(lambda: fh.read(1 << 20), b""):
                  h.update(b)
          entry = {"file": os.path.basename(f), "size": os.path.getsize(f), "sha256": h.hexdigest(),
                   "bounds": [-77.8, 38.23, -73.4, 39.73], "minzoom": 0, "maxzoom": 14,
                   "created": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                   "build": open("out/Ncds_04_basemap.build").read().strip()}
          c = json.load(open("catalog.json"))
          reg = next((r for r in c["regions"] if r["ncds"] == "04"), None)
          if reg is None:
              raise SystemExit("Region 04 is not in the catalog")
          reg["basemap"] = entry
          json.dump(c, open("catalog.json", "w"), indent=1)
          print(entry)
          PY
          gh release upload $tag catalog.json --clobber
