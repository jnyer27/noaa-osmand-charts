name: ENC vector charts

# Issue #2: NOAA ENC -> OSM seamark/depth tags (tools/enc_to_osm.py) -> two OsmAnd maps
# per area with OsmAndMapCreator, like OsmAnd's own depth maps:
#   Depth_<name>.depth.obf  contours and depth areas, plus soundings in three map
#                           sections (zoom 11-12 coastal, 13-14 approach, 15+ harbor)
#   <Name>_seamarks.obf     marks, lights, hazards, piers, bridges, channels and areas
# Builds the Middle River test box (quick check) and an NCDS region (04 by default).
# Fails if an essential tag is not written or not kept (tools/obf_compare.py --require).
# Chart cells and OsmAndMapCreator are cached for the ISO week.
on:
  push:
    paths:
      - "tools/enc_to_osm.py"
      - "tools/obf_compare.py"
      - "tools/build_route_pack.py"
      - ".github/workflows/enc-vector-poc.yml"
  workflow_dispatch:
    inputs:
      region:
        description: "NCDS region code"
        default: "04"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test_middle_river
            args: -b=-76.50,39.20,-76.33,39.37
          - name: Ncds_${{ inputs.region || '04' }}
            args: -r ${{ inputs.region || '04' }}
    env:
      NAME: ${{ matrix.name }}
      JAVA_OPTS: -Xmx12g
    steps:
      - uses: actions/checkout@v4

      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache chart cells
        uses: actions/cache@v4
        with:
          path: enc-work
          key: enc-cells-${{ matrix.name }}-${{ steps.week.outputs.week }}

      - name: Cache OsmAndMapCreator
        uses: actions/cache@v4
        with:
          path: omc
          key: omc-${{ steps.week.outputs.week }}

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy

      - name: ENC to OSM
        run: |
          python3 tools/enc_to_osm.py ${{ matrix.args }} -o "out/$NAME" -w enc-work
          ls -l out

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: OsmAndMapCreator
        run: |
          if [ ! -f omc/utilities.sh ]; then
            curl -fsSL -o omc.zip https://download.osmand.net/latest-night-build/OsmAndMapCreator-main.zip
            rm -rf omc && mkdir omc && unzip -q omc.zip -d omc && rm omc.zip
          fi
          chmod +x omc/*.sh

      - name: OSM to OBF
        working-directory: out
        run: |
          set -euo pipefail
          OMC="$GITHUB_WORKSPACE/omc"
          lower=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
          # run CMD...: OsmAndMapCreator utilities in a folder of its own (it keeps work files
          # there, named after the output); prints the folder
          run() {
            local d; d=$(mktemp -d)
            (cd "$d" && bash "$OMC/utilities.sh" "$@" > log.txt 2>&1) || { tail -40 "$d/log.txt" >&2; return 1; }
            echo "$d"
          }
          parts=()
          for f in contours:: soundings_z11::11-12 soundings_z13::13-14 soundings_z15::15-; do
            osm="$PWD/${NAME}_${f%%::*}.osm" zooms=${f#*::}
            if ! grep -q -m1 '<node' "$osm"; then echo "$osm: empty, skipped"; continue; fi
            d=$(run generate-map "$osm" ${zooms:+--map-zooms=$zooms})
            obf=$(ls "$d"/*.obf | head -1)
            echo "$(basename "$osm") -> $(du -h "$obf" | cut -f1)${zooms:+, zooms $zooms}"
            parts+=("$obf")
          done
          depth="$PWD/Depth_${lower}.depth.obf"
          rm -f "$depth"
          if [ ${#parts[@]} -eq 1 ]; then mv "${parts[0]}" "$depth"; else run merge-index "$depth" "${parts[@]}" > /dev/null; fi
          d=$(run generate-obf-no-address "$PWD/${NAME}_seamarks.osm")
          mv "$(ls "$d"/*.obf | head -1)" "${NAME}_seamarks.obf"
          ls -l *.obf

      - name: Inspect the OBFs
        working-directory: out
        run: |
          JAVA_OPTS="-Xmx6g" ../omc/inspector.sh -vmap -vmapobjects Depth_*.depth.obf > inspect_depth.txt 2>&1 || true
          JAVA_OPTS="-Xmx6g" ../omc/inspector.sh -vmap -vmapobjects "${NAME}_seamarks.obf" > inspect_seamarks.txt 2>&1 || true
          # the inspector lists the objects shown at one zoom (15 by default): the coastal and
          # approach sounding sections only appear at their own zooms
          for z in 11 13; do
            JAVA_OPTS="-Xmx6g" ../omc/inspector.sh -vmap -vmapobjects -zoom=$z Depth_*.depth.obf > inspect_depth_z$z.txt 2>&1 || true
          done
          wc -l inspect_*.txt
          echo "== depth map sections"
          grep -v -E '^(Point|Way|Polygon|Multipolygon|Relation) ' inspect_depth.txt | head -40

      - name: Compare tags written and kept
        run: |
          set -o pipefail
          cd out
          rc=0
          python3 ../tools/obf_compare.py --title "$NAME depth map: tags written vs kept" \
            --osm "${NAME}_contours.osm" "${NAME}"_soundings_z*.osm --dump inspect_depth.txt \
            --require contour=depth contourarea=depth contourtype=5m point=depth depth \
            > compare.md || rc=1
          python3 ../tools/obf_compare.py --title "$NAME seamarks map: tags written vs kept" \
            --osm "${NAME}_seamarks.osm" --dump inspect_seamarks.txt \
            --require seamark:type=buoy_lateral seamark:buoy_lateral:colour seamark:buoy_lateral:shape \
              seamark:type=beacon_lateral seamark:beacon_lateral:colour seamark:light:character \
              seamark:light:colour seamark:type=fairway seamark:type=wreck seamark:type=obstruction \
              seamark:type=bridge seamark:name name \
            >> compare.md || rc=1
          # each sounding section holds every sounding of its set (dump at its own zoom)
          echo -e "\n### Sounding sections\n" >> compare.md
          for z in 11 13 15; do
            dump=inspect_depth_z$z.txt; [ $z = 15 ] && dump=inspect_depth.txt
            w=$(grep -c '<node' "${NAME}_soundings_z$z.osm" || true)
            k=$(grep -c 'point-depth' "$dump" || true)
            echo "- zoom $z: $w written, $k shown" >> compare.md
            [ "$k" -ge "$w" ] || { echo "  **Missing soundings at zoom $z**" >> compare.md; rc=1; }
          done
          cat compare.md >> "$GITHUB_STEP_SUMMARY"
          grep -A4 '^### Sounding' compare.md
          grep -A2 '^### Required' compare.md
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enc-vector-${{ matrix.name }}
          path: |
            out/*.obf
            out/*.report.json
            out/compare.md
          retention-days: 14
