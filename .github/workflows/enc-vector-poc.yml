name: ENC vector chart (proof of concept)

# Issue #2: NOAA ENC -> OSM seamark/depth tags (tools/enc_to_osm.py) -> .obf with
# OsmAndMapCreator, for Middle River, MD. Inspects the .obf and compares the tags
# written with the tags OsmAnd kept. Artifact: the .obf to import into OsmAnd, the
# .osm, the conversion report and the inspector dump.
on:
  push:
    paths:
      - "tools/enc_to_osm.py"
      - "tools/obf_compare.py"
      - ".github/workflows/enc-vector-poc.yml"
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy

      - name: ENC to OSM (Middle River)
        run: python3 tools/enc_to_osm.py -b=-76.50,39.24,-76.33,39.37 -o out/Noaa_enc_middle_river.osm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: OsmAndMapCreator
        run: |
          curl -fsSL -o omc.zip https://download.osmand.net/latest-night-build/OsmAndMapCreator-main.zip
          mkdir omc && unzip -q omc.zip -d omc
          chmod +x omc/*.sh

      - name: OSM to OBF
        working-directory: out
        run: |
          JAVA_OPTS="-Xmx4g" ../omc/utilities.sh generate-obf-no-address Noaa_enc_middle_river.osm 2>&1 | tail -40
          ls -l

      - name: Inspect the OBF
        working-directory: out
        run: |
          obf="$(ls *.obf | head -1)"
          JAVA_OPTS="-Xmx2g" ../omc/inspector.sh -vmap -vmapobjects "$obf" > inspect.txt 2>&1 || true
          wc -l inspect.txt
          head -60 inspect.txt

      - name: Reference, OsmAnd's own depth map (structure only, not redistributed)
        run: |
          curl -fsSL -o ref.zip "https://download.osmand.net/download?file=Swiss_Lakes_contours_2.depth.obf.zip&depth=yes"
          mkdir ref && unzip -q ref.zip -d ref && ls -l ref
          ref="$(ls ref/*.obf | head -1)"
          JAVA_OPTS="-Xmx3g" omc/inspector.sh -vmap -vmapobjects "$ref" > out/reference-inspect-full.txt 2>&1 || true
          # Section summary, then a sample of each kind of object
          grep -v '^Point\|^Way\|^Polygon\|^Multipolygon' out/reference-inspect-full.txt | head -40 > out/reference-inspect.txt
          for t in contour-depth contourarea-depth point-depth; do grep -m 15 "$t" out/reference-inspect-full.txt >> out/reference-inspect.txt; done
          grep -oE '^(Point|Way|Polygon|Multipolygon)' out/reference-inspect-full.txt | sort | uniq -c >> out/reference-inspect.txt
          grep -oE '(types|add_types) \[[^]]*\]' out/reference-inspect-full.txt | sed 's/([0-9]*)//g' | sort | uniq -c | sort -rn | head -40 >> out/reference-inspect.txt
          rm out/reference-inspect-full.txt
          cat out/reference-inspect.txt

      - name: Compare tags written and kept
        run: |
          python3 tools/obf_compare.py out/Noaa_enc_middle_river.osm out/inspect.txt | tee out/compare.md
          cat out/compare.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: enc-vector-middle-river
          path: |
            out/*.obf
            out/*.osm
            out/*.report.json
            out/inspect.txt
            out/reference-inspect.txt
            out/compare.md
          retention-days: 14
