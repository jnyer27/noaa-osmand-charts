name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: GPX output is valid GPX 1.1
        run: |
          command -v xmllint >/dev/null || sudo apt-get install -y libxml2-utils
          xmllint --noout --schema app/src/test/resources/gpx.xsd app/build/gpx-sample.gpx

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOAAROUTE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noaaroute.jks"
            echo "NOAAROUTE_KEYSTORE=$RUNNER_TEMP/noaaroute.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret; APK is signed with a throwaway debug key and cannot update a previous install"
          fi

      - name: Build APK
        env:
          NOAAROUTE_KEYSTORE_PASSWORD: ${{ secrets.NOAAROUTE_KEYSTORE_PASSWORD }}
          NOAAROUTE_KEY_ALIAS: ${{ secrets.NOAAROUTE_KEY_ALIAS }}
          NOAAROUTE_KEY_PASSWORD: ${{ secrets.NOAAROUTE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/noaa-route.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: noaa-route-apk
          path: noaa-route.apk

      - name: Publish to app release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # A fresh release for every build, so GitHub's release list shows this build's
          # version and date (uploading over an old release kept its first date). The tag
          # moves to this commit; the download URL .../releases/download/app/noaa-route.apk
          # stays the same.
          version="0.1.${GITHUB_RUN_NUMBER}"
          change="$(git log -1 --format=%s)"
          gh release delete app --yes --cleanup-tag 2>/dev/null || true
          gh release create app noaa-route.apk --target "$GITHUB_SHA" --latest \
            --title "NOAA Route $version ($(date -u +%Y-%m-%d))" \
            --notes "Version $version, built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}: $change

          Install noaa-route.apk over the previous version. Not for navigation."
