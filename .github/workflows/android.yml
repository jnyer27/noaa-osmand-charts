name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOAAROUTE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noaaroute.jks"
            echo "NOAAROUTE_KEYSTORE=$RUNNER_TEMP/noaaroute.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret; APK is signed with a throwaway debug key and cannot update a previous install"
          fi

      - name: Build APK
        env:
          NOAAROUTE_KEYSTORE_PASSWORD: ${{ secrets.NOAAROUTE_KEYSTORE_PASSWORD }}
          NOAAROUTE_KEY_ALIAS: ${{ secrets.NOAAROUTE_KEY_ALIAS }}
          NOAAROUTE_KEY_PASSWORD: ${{ secrets.NOAAROUTE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/noaa-route.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: noaa-route-apk
          path: noaa-route.apk

      - name: Publish to app release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view app >/dev/null 2>&1 || \
            gh release create app --title "NOAA Route app (latest build)" \
              --notes "Latest Android build of the NOAA Route planner. Not for navigation."
          gh release upload app noaa-route.apk --clobber
