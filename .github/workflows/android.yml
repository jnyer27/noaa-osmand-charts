name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle --no-daemon :core:test :cli:test testReleaseUnitTest

      - name: GPX output is valid GPX 1.1
        run: |
          command -v xmllint >/dev/null || sudo apt-get install -y libxml2-utils
          xmllint --noout --schema app/src/test/resources/gpx.xsd app/build/gpx-sample.gpx

      # The command-line planner as released (the zip's jar and launcher) on the released route data
      # and region chart: the "Maryland Marina to Ego Alley" reference route (24-29 nm) with Try to
      # avoid checks and the chart depth check, then the GPX files against GPX 1.1
      - name: Command-line planner
        env:
          NOAA_ROUTE_PACKS: ${{ runner.temp }}/cli-packs
          NOAA_ROUTE_CHARTS: ${{ runner.temp }}/cli-charts
        run: |
          gradle --no-daemon -q :cli:cliZip
          cp cli/build/dist/noaa-route.zip "$GITHUB_WORKSPACE/noaa-route.zip"
          rm -rf "$RUNNER_TEMP/cli" && unzip -q cli/build/dist/noaa-route.zip -d "$RUNNER_TEMP/cli"
          nr="$RUNNER_TEMP/cli/noaa-route/noaa-route"
          "$nr" --version
          cd "$RUNNER_TEMP"
          "$nr" -f 39.32371,-76.39998 -t 38.97731,-76.48559 -d 3 -a 10 --resolve -n cli-ego-alley
          "$nr" -f 39.32371,-76.39998 -t 38.97731,-76.48559 -d 3 -a 10 -n cli-ego-alley --offline --json -q > cli.json
          cat cli.json
          python3 -c "import json,sys; j=json.load(open(sys.argv[1])); nm=j['route']['nm']; cd=j['chartDepth']; print('nm', nm, '| chart depth:', cd); sys.exit(0 if 24 <= nm <= 29 and cd == 'Region 04 chart' else 1)" cli.json
          for f in cli-ego-alley*.gpx; do xmllint --noout --schema "$GITHUB_WORKSPACE/android/app/src/test/resources/gpx.xsd" "$f"; done
          # A bad option is exit code 2
          rc=0; "$nr" --bogus 2>/dev/null || rc=$?; test $rc -eq 2

      - uses: actions/upload-artifact@v7
        with:
          name: noaa-route-cli
          path: noaa-route.zip

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOAAROUTE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noaaroute.jks"
            echo "NOAAROUTE_KEYSTORE=$RUNNER_TEMP/noaaroute.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret; APK is signed with a throwaway debug key and cannot update a previous install"
          fi

      - name: Build APK
        env:
          NOAAROUTE_KEYSTORE_PASSWORD: ${{ secrets.NOAAROUTE_KEYSTORE_PASSWORD }}
          NOAAROUTE_KEY_ALIAS: ${{ secrets.NOAAROUTE_KEY_ALIAS }}
          NOAAROUTE_KEY_PASSWORD: ${{ secrets.NOAAROUTE_KEY_PASSWORD }}
          # Region chart tiles are published on the main vector-maps release. A branch
          # APK would otherwise download vector-maps-beta and miss them.
          NOAA_CATALOG: main
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/noaa-route.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: noaa-route-apk
          path: noaa-route.apk

      - name: Publish to app release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # A fresh release for every build, so GitHub's release list shows this build's
          # version and date (uploading over an old release kept its first date). The tag
          # moves to this commit; the download URL .../releases/download/app/noaa-route.apk
          # stays the same.
          version="0.1.${GITHUB_RUN_NUMBER}"
          change="$(git log -1 --format=%s)"
          gh release delete app --yes --cleanup-tag 2>/dev/null || true
          gh release create app noaa-route.apk --target "$GITHUB_SHA" --latest \
            --title "NOAA Route $version ($(date -u +%Y-%m-%d))" \
            --notes "Version $version, built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}: $change

          Install noaa-route.apk over the previous version. Not for navigation."

      - name: Publish to cli release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # Like the app release: recreated per build, same download URL
          # .../releases/download/cli/noaa-route.zip. Not marked latest (the app is).
          version="0.1.${GITHUB_RUN_NUMBER}"
          change="$(git log -1 --format=%s)"
          gh release delete cli --yes --cleanup-tag 2>/dev/null || true
          gh release create cli noaa-route.zip --target "$GITHUB_SHA" --latest=false \
            --title "noaa-route command line $version ($(date -u +%Y-%m-%d))" \
            --notes "Version $version, built $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}: $change

          The NOAA Route app's planner on the command line, for Windows, macOS, Linux and Termux. Needs Java 17 or later. Unzip and run noaa-route (noaa-route.cmd on Windows) --help. Not for navigation."
