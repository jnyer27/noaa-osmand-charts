name: Block build check (temporary)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal python3-numpy
      - run: |
          python3 tools/build_route_pack.py -a ncds_02b -o whole
          python3 tools/build_route_pack.py -a ncds_02b -o blocks --blocks
      - name: Compare tiles
        run: |
          python3 - <<'PY'
          import json, struct, zlib
          def read(p):
              f = open(p, "rb"); assert f.read(6) == b"NRPK2\n"
              hl = struct.unpack("<I", f.read(4))[0]; h = json.loads(f.read(hl))
              n = (h["width"] // h["tile"]) * (h["height"] // h["tile"])
              idx = [struct.unpack("<QI", f.read(12)) for _ in range(n)]
              tiles = {}
              for i, (o, l) in enumerate(idx):
                  if l:
                      f.seek(o); tiles[i] = zlib.decompress(f.read(l))
              return h, tiles
          hw, tw = read("whole/ncds_02b.bin"); hb, tb = read("blocks/ncds_02b.bin")
          assert (hw["width"], hw["height"], hw["tx0"], hw["ty0"]) == (hb["width"], hb["height"], hb["tx0"], hb["ty0"])
          # Depth indices differ between the builds (table order); compare the ranges they stand for
          import numpy as np
          def depths(h, t):
              a = np.frombuffer(t, np.uint8).reshape(6, 256, 256).copy()
              table = h["depth_table"]
              return a, [json.dumps(table[i]) for i in a[0].ravel()]
          print("tiles with data: whole", len(tw), "blocks", len(tb))
          bad = 0
          for i in sorted(set(tw) | set(tb)):
              if i not in tw or i not in tb:
                  bad += 1; print("tile", i, "only in", "whole" if i in tw else "blocks"); continue
              a, da = depths(hw, tw[i]); b, db = depths(hb, tb[i])
              diff = [p for p in range(1, 6) if not np.array_equal(a[p], b[p])]
              if da != db: diff.append(0)
              if diff:
                  bad += 1; print("tile", i, "planes differ", diff, [int((a[p] != b[p]).sum()) for p in diff if p])
          nw = {json.dumps(n, sort_keys=True) for n in hw["notes"]}; nb = {json.dumps(n, sort_keys=True) for n in hb["notes"]}
          print("notes: whole", len(nw), "blocks", len(nb), "only whole", len(nw - nb), "only blocks", len(nb - nw))
          print("tiles that differ:", bad)
          raise SystemExit(1 if bad else 0)
          PY
